<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logged Out | My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      /* Gradient background similar to your login page */
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    .logout-card {
      background: #fff;
      padding: 40px 35px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      position: relative;
      animation: fadeInUp 0.8s ease-in-out;
    }

    /* Big tick circle with bright green */
    .tick-circle {
      width: 90px;
      height: 90px;
      background-color: #32CD32; /* bright lime green */
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      font-size: 45px;
      color: #fff;
    }

    .logout-card h2 {
      color: #111;
      font-weight: 800; /* thicker text */
      margin-bottom: 15px;
      font-size: 2rem; /* slightly bigger */
    }

    .logout-card p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      border-radius: 10px;
      padding: 10px 25px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .login-btn {
      background: linear-gradient(90deg, #667eea, #764ba2); /* gradient button */
      color: #fff;
      border: none;
    }

    .login-btn:hover {
      background: linear-gradient(90deg, #5a67d8, #6b46c1);
    }

    .register-btn {
      background-color: #6c757d; /* neutral gray */
      color: #fff;
      border: none;
    }

    .register-btn:hover {
      background-color: #5a6268;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="logout-card">
    <div class="tick-circle">✔</div> <!-- Big bright green tick -->
    <h2>Logged Out</h2> <!-- Thicker text -->
    <p>You’ve successfully logged out. You can log in again or create a new account.</p>

    <div class="d-flex justify-content-center gap-2">
      <a href="{% url 'login' %}" class="btn login-btn">Login</a>
      <a href="{% url 'register' %}" class="btn register-btn">Register</a>
    </div>
  </div>
</body>
</html>
